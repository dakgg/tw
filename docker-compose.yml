# Optional database for the future PostgreSQL adapter. Not used by the current API.
# A separate volume preserves databases from earlier versions of this repository.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project_eh
      POSTGRES_USER: eh
      POSTGRES_PASSWORD: eh
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - project-eh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eh -d project_eh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  project-eh-postgres-data:
